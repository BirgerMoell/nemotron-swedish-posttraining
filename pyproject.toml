[project]
name = "nemotron-swedish-posttraining"
version = "0.1.0"
description = "Swedish post-training experiments for NVIDIA Nemotron"
requires-python = ">=3.10"
dependencies = [
  "datasets>=3.0,<5",
  "huggingface-hub>=0.34,<2",
  "peft>=0.18,<0.19",
  "safetensors>=0.4",
  "torch>=2.6",
  "transformers>=4.57,<5",
]

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py310"

